[project]
name = "rambu-backend"
version = "0.1.0"
description = "Rambu backend: call transcription, scam analysis, family alerts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "httpx[http2]>=0.28",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
